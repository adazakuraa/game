<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢検ランダム漢字</title>
<style>
  :root {
    --bg: #f6f1e7;
    --paper: #fffdf8;
    --ink: #1f1a17;
    --sub: #7a6f66;
    --line: #e3d9c9;
    --accent: #b3302a;
    --accent-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917;
      --paper: #26231f;
      --ink: #f1ebe2;
      --sub: #a69a8e;
      --line: #3a352f;
      --accent: #d9463d;
      --accent-ink: #fff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; letter-spacing: .08em; }
  .pool { font-size: .85rem; color: var(--sub); margin: 0 0 20px; }
  .stage {
    width: 100%;
    max-width: 760px;
    min-height: 240px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px 4px;
    padding: 24px 12px;
  }
  .kanji {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 1;
    animation: pop .25s ease-out;
    text-align: center;
  }
  .n1 .kanji { font-size: min(44vw, 200px); }
  .n2 .kanji { font-size: min(36vw, 170px); }
  .n3 .kanji { font-size: min(26vw, 150px); }
  .n4 .kanji { font-size: min(20vw, 130px); }
  .n5 .kanji { font-size: min(16vw, 120px); }
  .placeholder { color: var(--sub); font-size: 1rem; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

  .draw {
    margin: 24px 0 28px;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: .1em;
    padding: 16px 56px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.18);
    -webkit-tap-highlight-color: transparent;
  }
  .draw:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }

  .options {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px 32px;
    justify-content: center;
    align-items: center;
  }
  .opt { display: flex; align-items: center; gap: 10px; font-size: .95rem; }
  .opt-label { color: var(--sub); }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
  .seg button {
    border: none; background: transparent; color: var(--ink);
    font: inherit; padding: 8px 14px; cursor: pointer; min-width: 42px;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }

  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .track {
    width: 46px; height: 26px; border-radius: 13px; background: var(--line);
    position: relative; transition: background .15s;
  }
  .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 23px; }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .note { margin-top: 32px; font-size: .75rem; color: var(--sub); max-width: 760px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
  <h1>漢検ランダム漢字</h1>
  <p class="pool" id="pool"></p>

  <div class="stage n1" id="stage" aria-live="polite">
    <span class="placeholder">ボタンを押すと漢字が出ます</span>
  </div>

  <button class="draw" id="draw" type="button">漢字を出す</button>

  <div class="options">
    <div class="opt">
      <span class="opt-label">表示数</span>
      <div class="seg" id="count" role="group" aria-label="表示数">
        <button type="button" data-n="1" aria-pressed="true">1</button>
        <button type="button" data-n="2" aria-pressed="false">2</button>
        <button type="button" data-n="3" aria-pressed="false">3</button>
        <button type="button" data-n="4" aria-pressed="false">4</button>
        <button type="button" data-n="5" aria-pressed="false">5</button>
      </div>
    </div>
    <label class="switch opt">
      <input type="checkbox" id="joyo">
      <span class="track"></span>
      <span>常用漢字のみ</span>
    </label>
  </div>

  <p class="note">
    出題範囲：漢検10級〜1級の配当漢字（1級の対象であるJIS第1・第2水準漢字6,355字と、それに含まれない常用漢字「𠮟・塡・剝・頰」の計6,359字）。<br>
    「常用漢字のみ」は2010年改定の常用漢字2,136字（10級〜2級の範囲）。
  </p>

<script src="kanji-data.js"></script>
<script>
  // Array.from でサロゲートペア（𠮟など）も1文字として扱う
  const joyoList = Array.from(JOYO);
  const allList = joyoList.concat(Array.from(HYOGAI));

  const stage = document.getElementById('stage');
  const pool = document.getElementById('pool');
  const joyoBox = document.getElementById('joyo');
  const countSeg = document.getElementById('count');

  let count = 1;
  let last = new Set();

  function currentList() { return joyoBox.checked ? joyoList : allList; }

  function updatePool() {
    pool.textContent = (joyoBox.checked ? '常用漢字' : '漢検配当漢字（全級）') +
      ' ' + currentList().length.toLocaleString() + '字から出題';
  }

  function randInt(n) {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] % n;
  }

  // 重複なし、かつ直前に出た字は避けて count 個選ぶ
  function pick(list, n) {
    const chosen = new Set();
    while (chosen.size < n) {
      const c = list[randInt(list.length)];
      if (!last.has(c)) chosen.add(c);
    }
    return Array.from(chosen);
  }

  function draw() {
    const chars = pick(currentList(), count);
    last = new Set(chars);
    stage.className = 'stage n' + count;
    stage.replaceChildren(...chars.map(c => {
      const s = document.createElement('span');
      s.className = 'kanji';
      s.textContent = c;
      return s;
    }));
  }

  countSeg.addEventListener('click', e => {
    const b = e.target.closest('button[data-n]');
    if (!b) return;
    count = Number(b.dataset.n);
    countSeg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  });
  joyoBox.addEventListener('change', updatePool);
  document.getElementById('draw').addEventListener('click', draw);
  updatePool();
</script>
</body>
</html>
